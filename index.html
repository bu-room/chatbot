<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>와방 | 공인중개사 이하늘 - 자동 매물 접수 챗봇</title>

  <!-- Pretendard 폰트 & Tailwind CSS & Phosphor Icons -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'] },
          colors: {
            brand: {
              50: '#F0F9FF',
              100: '#E0F2FE',
              200: '#BAE6FD',
              500: '#0EA5E9',
              600: '#0284C7',
              700: '#0369A1',
            }
          }
        }
      }
    };
  </script>

  <style>
    body {
      background-color: #E2EEF8;
      color: #0F172A;
      -webkit-tap-highlight-color: transparent;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 말풍선 팝업 애니메이션 */
    @keyframes popIn {
      0% { opacity: 0; transform: translateY(10px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .msg-anim {
      animation: popIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 타이핑 인디케이터 애니메이션 */
    @keyframes bounceDot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
    .typing-dot {
      animation: bounceDot 1.2s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
  </style>
</head>
<body class="h-[100dvh] flex justify-center overflow-hidden">

  <!-- ================= 설정 영역 (실제 사용 시 링크만 수정하세요) ================= -->
  <script>
    const CONFIG = {
      PHONE: "010-4445-6432",                               // 중개사 휴대폰 번호
      KAKAO_OPENCHAT_URL: "https://open.kakao.com/o/sample", // 오픈카카오톡 1:1 채팅 링크
      INSTAGRAM_DM_URL: "https://ig.me/m/bu_room",          // 인스타그램 DM 링크
      LISTING_SITE_URL: "https://skylee-lang.github.io/wa-bang/"        // 와방 매물 보는 사이트 주소
    };
  </script>
  <!-- ========================================================================= -->

  <!-- 모바일 퍼스트 중앙 컨테이너 (데스크톱에서도 모바일 앱 비율 유지) -->
  <div class="w-full max-w-md h-[100dvh] bg-[#F4FAFF] shadow-2xl border-x border-sky-100 flex flex-col relative overflow-hidden">

    <!-- 상단 고정 헤더 -->
    <header class="shrink-0 bg-white/95 backdrop-blur-md border-b border-sky-100 z-20">
      <div class="px-4 h-16 flex items-center justify-between gap-2">
        <!-- 브랜드 로고 & 상태 -->
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-10 h-10 rounded-2xl bg-[#0284C7] flex items-center justify-center shrink-0 shadow-sm">
            <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor">
              <path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z" />
              <path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z" />
            </svg>
          </div>
          <div class="leading-tight truncate">
            <div class="flex items-center gap-1.5">
              <span class="text-base font-extrabold text-slate-900">와방</span>
              <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 text-[10px] font-bold">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>응답가능
              </span>
            </div>
            <div class="text-[11px] font-medium text-sky-700 truncate">공인중개사 이하늘 · 자동 매물 접수 챗봇</div>
          </div>
        </div>

        <!-- 우측 유틸 버튼 그룹 -->
        <div class="flex items-center gap-1.5 shrink-0">
          <button type="button" id="previewBtn" onclick="previewSampleCompletion()" title="12단계를 건너뛰고 완료 화면 디자인 바로보기"
            class="hidden inline-flex items-center gap-1 px-2 py-1.5 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 text-[11px] font-bold transition">
            <i class="ph-fill ph-sparkle text-xs text-amber-500"></i>
            <span>완료미리보기</span>
          </button>
          <button type="button" onclick="restartChat()" title="처음부터 다시하기"
            class="w-8 h-8 rounded-xl bg-sky-50 hover:bg-sky-100 text-sky-800 border border-sky-200 flex items-center justify-center transition">
            <i class="ph-bold ph-arrow-counter-clockwise text-sm"></i>
          </button>
          <button type="button" onclick="goToListingSite()"
            class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-[#0284C7] hover:bg-sky-700 text-white text-[11px] font-bold shadow-sm transition">
            <i class="ph-fill ph-house-line text-xs"></i>
            <span>매물보기</span>
          </button>
        </div>
      </div>

      <!-- 진행률 표시 바 -->
      <div class="px-4 pb-2.5 bg-white/95">
        <div class="flex items-center justify-between text-[11px] font-semibold text-slate-400 mb-1">
          <span id="progressLabel">맞춤 매물 조건 접수 준비</span>
          <span id="progressCount" class="text-[#0284C7] font-bold">0 / 12</span>
        </div>
        <div class="w-full h-1.5 bg-sky-100 rounded-full overflow-hidden">
          <div id="progressBar" class="h-full bg-[#0284C7] rounded-full transition-all duration-300" style="width: 0%;"></div>
        </div>
      </div>
    </header>

    <!-- 중앙 채팅 대화 영역 -->
    <main id="chatScrollArea" class="flex-1 overflow-y-auto px-4 py-5 space-y-4">
      <div id="chatContainer" class="space-y-4 pb-6">
        <!-- 자바스크립트로 말풍선과 요약 카드가 렌더링됩니다 -->
      </div>
    </main>

    <!-- 하단 빠른 선택 칩 & 텍스트 입력 바 -->
    <footer id="inputArea" class="shrink-0 bg-white border-t border-sky-100 z-20">
      <div class="px-4 py-3 space-y-2.5">
        <!-- 빠른 선택 칩 -->
        <div id="quickChipsContainer" class="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto no-scrollbar"></div>

        <!-- 다중 선택 확인 바 (9단계 옵션 선택 시 표시) -->
        <div id="multiSelectBar" class="hidden flex items-center justify-between bg-sky-50 px-3 py-2 rounded-xl border border-sky-200">
          <span id="multiSelectCount" class="text-xs font-bold text-[#0284C7]">0개 선택됨</span>
          <button type="button" onclick="confirmMultiSelect()"
            class="px-3.5 py-1.5 rounded-lg bg-[#0284C7] text-white text-xs font-bold shadow-sm hover:bg-sky-700 transition">
            선택 완료 <i class="ph-bold ph-check ml-0.5"></i>
          </button>
        </div>

        <!-- 직접 입력 폼 -->
        <form id="chatForm" onsubmit="handleFormSubmit(event)" class="flex items-center gap-2">
          <button type="button" id="prevStepBtn" onclick="goPrevStep()" title="이전 질문으로"
            class="hidden shrink-0 w-10 h-10 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition">
            <i class="ph-bold ph-arrow-u-up-left text-base"></i>
          </button>
          <input id="userInput" type="text" autocomplete="off" placeholder="답변을 입력하거나 위 버튼을 눌러주세요..."
            class="flex-1 px-4 py-2.5 rounded-2xl bg-sky-50/80 border border-sky-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-[#0284C7] focus:bg-white transition" />
          <button type="submit"
            class="shrink-0 w-10 h-10 rounded-2xl bg-[#0284C7] hover:bg-sky-700 active:scale-95 text-white flex items-center justify-center shadow-sm transition">
            <i class="ph-fill ph-paper-plane-right text-base"></i>
          </button>
        </form>
      </div>
    </footer>

    <!-- 상단 토스트 알림 메시지 -->
    <div id="toast" class="absolute top-20 left-1/2 -translate-x-1/2 z-[60] hidden px-4 py-2.5 rounded-full bg-slate-900/95 text-white text-xs font-bold shadow-lg flex items-center gap-1.5 w-max max-w-[90%]">
      <i class="ph-fill ph-check-circle text-emerald-400 text-base shrink-0"></i>
      <span id="toastText" class="truncate">복사되었습니다!</span>
    </div>

    <!-- 전송 후 후속 행동 선택 모달 (매물 사이트 이동 / 창 닫기) -->
    <div id="afterSendModal" class="absolute inset-0 z-50 hidden items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
      <div class="bg-white rounded-3xl max-w-sm w-full p-6 space-y-5 shadow-2xl msg-anim border border-sky-100">
        <div class="text-center space-y-2">
          <div class="w-12 h-12 rounded-2xl bg-sky-50 text-[#0284C7] flex items-center justify-center mx-auto text-2xl shadow-sm">
            <i class="ph-fill ph-paper-plane-tilt"></i>
          </div>
          <h3 id="modalTitle" class="text-base font-extrabold text-slate-900">문의 내용이 복사되었습니다!</h3>
          <p id="modalDesc" class="text-xs text-slate-500 leading-relaxed">
            열린 채팅창에 <b>붙여넣기(길게 누르기 → 붙여넣기)</b> 후 전송해 주세요.<br/>
            전송을 마치셨다면 아래에서 다음 단계를 선택해 주세요!
          </p>
        </div>

        <div class="space-y-2.5">
          <button type="button" onclick="goToListingSite()"
            class="w-full py-3.5 rounded-2xl bg-[#0284C7] hover:bg-sky-700 active:scale-[0.99] text-white font-extrabold text-sm shadow-sm flex items-center justify-center gap-2 transition">
            <i class="ph-fill ph-house-line text-lg"></i>
            <span>🏠 와방 매물 보러가기</span>
          </button>

          <button type="button" onclick="closeCurrentWindow()"
            class="w-full py-3.5 rounded-2xl bg-slate-100 hover:bg-slate-200 active:scale-[0.99] text-slate-700 font-bold text-sm flex items-center justify-center gap-2 transition">
            <i class="ph-bold ph-x text-base"></i>
            <span>✕ 창 닫기</span>
          </button>
        </div>

        <div class="text-center">
          <button type="button" onclick="hideAfterSendModal()" class="text-[11px] text-slate-400 hover:text-slate-600 underline">
            요약 화면으로 돌아가기
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ================= 챗봇 질문 시나리오 (12단계) =================
    const STEPS = [
      {
        key: "structure",

      },
      {
        key: "moveInDate",
        label: "입주예정일",
        question: "희망하시는 <b>입주예정일</b>은 언제쯤인가요? 📅",

      },
      {
        key: "deposit",
        label: "보증금",
        question: "생각해 두신 <b>보증금</b> 예산은 어느 정도인가요? 💰",
        placeholder: "예: 2,000만원, 5,000만원 등 직접 입력",
        chips: ["500만원", "1,000만원", "3,000만원", "5,000만원", "1억 이상"]
      },
      {
        key: "monthlyRent",
        label: "월세",
        question: "희망하시는 <b>월세(또는 전세·매매 예산)</b> 범위를 알려주세요!",
        placeholder: "예: 월세 60만원 이하, 전세 2억대 등",
        chips: ["전세/매매 희망", "50만원 이하", "50~80만원", "80~120만원", "120만원 이상"]
      },
      {
        key: "adminFee",
        label: "관리비(포함/별도)",
        question: "<b>관리비(포함 또는 별도 여부)</b>에 대해 선호하시는 조건이 있나요?",
        placeholder: "예: 관리비 포함 70 이하, 별도 10만 이하 등",
        chips: ["관리비 포함 희망", "별도 무관 (10만 이하)", "상관없음"]
      },
      {
        key: "location",
        label: "찾으시는 위치",
        question: "<b>찾으시는 위치(지역/역세권)</b>를 알려주세요! 📍",
        placeholder: "예: 역삼역 도보 10분 이내, 수지구청역 인근 등",
        chips: ["지하철 역세권 도보 10분 이내", "조용한 주택가/공원 인근", "직장·학교 근처 (지역 직접입력)"]
      },
      {
        key: "parking",
        label: "주차 여부",
        question: "<b>주차 여부</b>와 차량 종류(승용 or SUV)를 알려주세요! 🚗",
        placeholder: "예: 주차 1대 필수 (SUV), 주차 불필요 등",
        chips: ["주차 불필요", "필요 (승용차)", "필요 (SUV/대형)", "경차"]
      },
      {
        key: "pet",
        label: "반려동물 여부",
        question: "함께 거주할 <b>반려동물 여부</b>를 알려주세요! 🐾",
        placeholder: "예: 소형견 1마리, 고양이 2마리, 없음 등",
        chips: ["없음", "강아지 1마리", "고양이 1마리", "기타 / 다견·다묘"]
      },
      {
        key: "options",
        label: "원하시는 옵션",
        question: "<b>원하시는 옵션</b>을 모두 골라주시거나 직접 적어주세요! ✨\n<span class='text-xs text-slate-400 font-normal'>(여러 개 선택 후 '선택 완료'를 눌러주세요)</span>",
        placeholder: "추가로 원하시는 옵션을 직접 입력하셔도 됩니다",
        multiSelect: true,
        chips: ["풀옵션(세탁기/냉장고/에어컨)", "건조기", "엘리베이터", "베란다/테라스", "보안/CCTV", "신축급", "특이사항 없음"]
      },
      {
        key: "priority",
        label: "중요시 보는 부분",
        question: "<b>집 구하실 때 가장 중요시 보는 부분</b>은 무엇인가요? 👀",
        placeholder: "예: 채광, 수압, 층간소음, 가성비 등",
        chips: ["채광 / 남향", "조용한 주변환경", "역세권 / 교통편의", "수압 / 깔끔한 컨디션", "가성비 (금액)"]
      },
      {
        key: "viewingDate",
        label: "방 보실 수 있는 날짜",
        question: "실제로 <b>방 보실 수 있는 날짜와 시간대</b>는 언제인가요? 🗓️",
        placeholder: "예: 이번 주 토요일 오후 2시, 평일 저녁 7시 이후",
        chips: ["이번 주 평일", "이번 주 주말", "언제든 가능 (시간 협의)"]
      },
      {
        key: "contact",
        label: "연락처",
        question: "마지막으로 맞춤 매물 리스트를 받아보실 <b>성함 / 연락처</b>를 남겨주세요! 📱",
        placeholder: "예: 홍길동 / 010-1234-5678",
        chips: ["카톡/DM으로 바로 보낼게요 (생략)"]
      }
    ];

    // ================= 상태 관리 =================
    let currentStepIdx = -1;
    let answers = {};
    let selectedMultiOptions = [];
    let isCompleted = false;
    let editReturn = false;   // 답변 수정 중인지

    document.addEventListener("DOMContentLoaded", () => {
      if (/[?&]preview/.test(location.search)) document.getElementById("previewBtn").classList.remove("hidden");
      startGreeting();
    });

    function scrollToBottom() {
      const area = document.getElementById("chatScrollArea");
      setTimeout(() => {
        area.scrollTo({ top: area.scrollHeight, behavior: "smooth" });
      }, 60);
    }

    function updateProgress() {
      const total = STEPS.length;
      const done = isCompleted ? total : Math.max(0, currentStepIdx);
      const pct = Math.round((done / total) * 100);

      document.getElementById("progressBar").style.width = `${pct}%`;
      document.getElementById("progressCount").textContent = `${done} / ${total}`;
      document.getElementById("progressLabel").textContent = isCompleted
        ? "모든 조건 접수 완료!"
        : currentStepIdx < 0
          ? "맞춤 매물 조건 접수 준비"
          : `${STEPS[currentStepIdx].label} 입력 중`;

      const prevBtn = document.getElementById("prevStepBtn");
      if (currentStepIdx > 0 && !isCompleted) {
        prevBtn.classList.remove("hidden");
      } else {
        prevBtn.classList.add("hidden");
      }
    }

    // ================= 말풍선 렌더링 =================
    function appendBotMessage(htmlContent, delay = 280) {
      return new Promise((resolve) => {
        const container = document.getElementById("chatContainer");

        const typingId = `typing_${Date.now()}`;
        const typingEl = document.createElement("div");
        typingEl.id = typingId;
        typingEl.className = "flex items-end gap-2.5 msg-anim";
        typingEl.innerHTML = `
          <div class="w-8 h-8 rounded-2xl bg-[#0284C7] text-white flex items-center justify-center shrink-0 shadow-sm text-sm">
            <i class="ph-fill ph-paw-print"></i>
          </div>
          <div class="bg-white border border-sky-100 px-4 py-3 rounded-2xl rounded-bl-md shadow-sm flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-sky-400 typing-dot"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-sky-400 typing-dot"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-sky-400 typing-dot"></span>
          </div>
        `;
        container.appendChild(typingEl);
        scrollToBottom();

        setTimeout(() => {
          const t = document.getElementById(typingId);
          if (t) t.remove();

          const msgEl = document.createElement("div");
          msgEl.className = "flex items-start gap-2.5 msg-anim";
          msgEl.innerHTML = `
            <div class="w-8 h-8 rounded-2xl bg-[#0284C7] text-white flex items-center justify-center shrink-0 shadow-sm mt-0.5 text-sm">
              <i class="ph-fill ph-paw-print"></i>
            </div>
            <div class="max-w-[84%] space-y-1">
              <div class="text-[11px] font-bold text-slate-500 ml-1">와방 매니저</div>
              <div class="bg-white border border-sky-100 text-slate-800 text-sm px-4 py-3 rounded-2xl rounded-tl-md shadow-sm leading-relaxed whitespace-pre-line">
                ${htmlContent}
              </div>
            </div>
          `;
          container.appendChild(msgEl);
          scrollToBottom();
          resolve();
        }, delay);
      });
    }

    function appendUserMessage(text, stepIdxToEdit = null) {
      const container = document.getElementById("chatContainer");
      const msgEl = document.createElement("div");
      msgEl.className = "flex justify-end msg-anim";
      msgEl.innerHTML = `
        <div class="max-w-[82%] flex flex-col items-end gap-1">
          <div class="bg-[#0284C7] text-white text-sm font-medium px-4 py-2.5 rounded-2xl rounded-tr-md shadow-sm leading-relaxed break-keep">
            ${escapeHtml(text)}
          </div>
          ${stepIdxToEdit !== null ? `
            <button type="button" onclick="editFromStep(${stepIdxToEdit})" class="text-[11px] text-slate-400 hover:text-[#0284C7] underline pr-1">
              수정하기
            </button>
          ` : ""}
        </div>
      `;
      container.appendChild(msgEl);
      scrollToBottom();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // ================= 챗봇 대화 흐름 제어 =================
    async function startGreeting() {
      currentStepIdx = -1;
      answers = {};
      selectedMultiOptions = [];
      isCompleted = false;
      editReturn = false;
      document.getElementById("chatContainer").innerHTML = "";
      document.getElementById("inputArea").classList.remove("hidden");
      hideAfterSendModal();
      updateProgress();

      await appendBotMessage(
        "안녕하세요! <b>와방 · 공인중개사 이하늘</b> 자동 매물 접수 챗봇입니다. 🏡\n\n원하시는 집 조건을 1분 만에 간단히 알려주시면, 조건에 딱 맞는 실매물을 찾아 빠르게 안내해 드릴게요!",
        250
      );

      renderQuickChips(["네, 시작할게요! 🐾"], false);
      document.getElementById("userInput").placeholder = "'네, 시작할게요!' 버튼을 눌러주세요";
    }

    function restartChat() {
      startGreeting();
    }

    // 디자인 확인용 샘플 완료 화면 바로보기
    async function previewSampleCompletion() {
      answers = {
        structure: "투룸",
        moveInDate: "1개월 이내",
        deposit: "3,000만원",
        monthlyRent: "80~120만원",
        adminFee: "별도 무관 (10만 이하)",
        location: "지하철 역세권 도보 10분 이내",
        parking: "필요 (SUV/대형)",
        pet: "없음",
        options: "풀옵션(세탁기/냉장고/에어컨), 엘리베이터, 보안/CCTV",
        priority: "채광 / 남향",
        viewingDate: "이번 주 주말",
        contact: "김와방 / 010-1234-5678"
      };
      document.getElementById("chatContainer").innerHTML = "";
      appendUserMessage("샘플 조건으로 완료 화면 디자인 미리보기");
      await finishConversation(150);
    }

    async function goToStep(idx) {
      currentStepIdx = idx;
      selectedMultiOptions = [];
      updateProgress();

      if (idx >= STEPS.length) {
        await finishConversation();
        return;
      }

      const step = STEPS[idx];
      document.getElementById("userInput").value = "";
      document.getElementById("userInput").placeholder = step.placeholder || "답변을 입력해 주세요...";
      renderQuickChips(step.chips || [], !!step.multiSelect);

      await appendBotMessage(step.question, 260);
    }

    function goPrevStep() {
      if (currentStepIdx > 0 && !isCompleted) {
        appendUserMessage("이전 질문으로 돌아갈게요");
        goToStep(currentStepIdx - 1);
      }
    }

    function editFromStep(stepIdx) {
      editReturn = true;
      isCompleted = false;
      document.getElementById("inputArea").classList.remove("hidden");
      appendUserMessage(`'${STEPS[stepIdx].label}' 항목을 다시 입력할게요`);
      goToStep(stepIdx);
    }

    // ================= 빠른 선택 칩 & 입력 처리 =================
    function renderQuickChips(chips, isMulti) {
      const wrap = document.getElementById("quickChipsContainer");
      const multiBar = document.getElementById("multiSelectBar");

      if (!isMulti) {
        multiBar.classList.add("hidden");
        wrap.innerHTML = chips.map(chip => `
          <button type="button" onclick="handleChipClick('${chip.replace(/'/g, "\\'")}')"
            class="px-3.5 py-2 rounded-full bg-sky-50 hover:bg-[#0284C7] text-[#0284C7] hover:text-white border border-sky-200 text-xs font-bold transition shrink-0">
            ${chip}
          </button>
        `).join("");
      } else {
        multiBar.classList.remove("hidden");
        updateMultiBarText();
        wrap.innerHTML = chips.map(chip => {
          const active = selectedMultiOptions.includes(chip);
          return `
            <button type="button" onclick="toggleMultiChip('${chip.replace(/'/g, "\\'")}')"
              class="px-3.5 py-2 rounded-full text-xs font-bold border transition shrink-0 ${
                active
                  ? "bg-[#0284C7] text-white border-[#0284C7] shadow-sm"
                  : "bg-sky-50 text-[#0284C7] border-sky-200 hover:bg-sky-100"
              }">
              ${active ? "✓ " : "+ "}${chip}
            </button>
          `;
        }).join("");
      }
    }

    function toggleMultiChip(chip) {
      if (chip === "특이사항 없음") {
        selectedMultiOptions = ["특이사항 없음"];
      } else {
        selectedMultiOptions = selectedMultiOptions.filter(c => c !== "특이사항 없음");
        const idx = selectedMultiOptions.indexOf(chip);
        if (idx >= 0) selectedMultiOptions.splice(idx, 1);
        else selectedMultiOptions.push(chip);
      }
      const step = STEPS[currentStepIdx];
      renderQuickChips(step.chips || [], true);
    }

    function updateMultiBarText() {
      document.getElementById("multiSelectCount").textContent = `${selectedMultiOptions.length}개 선택됨`;
    }

    function confirmMultiSelect() {
      const customVal = document.getElementById("userInput").value.trim();
      const combined = [...selectedMultiOptions];
      if (customVal) combined.push(customVal);

      const finalAnswer = combined.length > 0 ? combined.join(", ") : "특이사항 없음";
      submitAnswer(finalAnswer);
    }

    function handleChipClick(value) {
      if (currentStepIdx === -1) {
        appendUserMessage(value);
        goToStep(0);
        return;
      }
      submitAnswer(value);
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const inputEl = document.getElementById("userInput");
      const val = inputEl.value.trim();

      if (currentStepIdx === -1) {
        appendUserMessage(val || "네, 시작할게요! 🐾");
        inputEl.value = "";
        goToStep(0);
        return;
      }

      const step = STEPS[currentStepIdx];
      if (step && step.multiSelect) {
        confirmMultiSelect();
        return;
      }

      if (!val) return;
      submitAnswer(val);
    }

    function submitAnswer(value) {
      const step = STEPS[currentStepIdx];
      answers[step.key] = value;
      document.getElementById("userInput").value = "";
      appendUserMessage(value, currentStepIdx);
      if (editReturn) {   // 수정한 뒤에는 아직 답하지 않은 항목으로, 모두 답했으면 요약 화면으로
        editReturn = false;
        const next = STEPS.findIndex(st => !answers[st.key]);
        goToStep(next === -1 ? STEPS.length : next);
        return;
      }
      goToStep(currentStepIdx + 1);
    }

    // ================= 완료 요약 카드 생성 및 전송 액션 =================
    function buildFormattedSummaryText() {
      return [
        "[와방 · 맞춤 매물 문의 접수]",
        `• 구조: ${answers.structure || "-"}`,
        `• 입주예정일: ${answers.moveInDate || "-"}`,
        `• 보증금: ${answers.deposit || "-"}`,
        `• 월세: ${answers.monthlyRent || "-"}`,
        `• 관리비(포함/별도): ${answers.adminFee || "-"}`,
        `• 찾으시는 위치: ${answers.location || "-"}`,
        `• 주차 여부: ${answers.parking || "-"}`,
        `• 반려동물 여부: ${answers.pet || "-"}`,
        `• 원하시는 옵션: ${answers.options || "-"}`,
        `• 중요시 보는 부분: ${answers.priority || "-"}`,
        `• 방 보실 수 있는 날짜: ${answers.viewingDate || "-"}`,
        `• 연락처: ${answers.contact || "-"}`
      ].join("\n");
    }

    async function finishConversation(delay = 320) {
      isCompleted = true;
      updateProgress();
      document.getElementById("inputArea").classList.add("hidden");
      const oldCard = document.getElementById("summaryCard");
      const again = !!oldCard;
      if (oldCard) oldCard.remove();

      await appendBotMessage(
        again ? "수정하신 내용으로 다시 정리했어요! 아래 버튼으로 문의를 보내주세요. ✅" : "감사합니다! 알려주신 희망 조건이 모두 정리되었습니다. 🎉\n\n아래 <b>오픈카카오톡</b> 또는 <b>인스타그램 DM</b> 버튼을 누르시면 문의 내용이 <b>자동으로 복사</b>되면서 채팅창이 열립니다. 채팅창에 <b>붙여넣기</b>만 해서 보내주세요!",
        delay
      );

      const summaryText = buildFormattedSummaryText();
      const phone = (CONFIG.PHONE || "").trim();
      const smsSeparator = /iPhone|iPad|iPod/i.test(navigator.userAgent) ? "&" : "?";
      const smsHref = `sms:${phone}${smsSeparator}body=${encodeURIComponent(summaryText)}`;

      const container = document.getElementById("chatContainer");
      const cardEl = document.createElement("div");
      cardEl.id = "summaryCard";
      cardEl.className = "msg-anim bg-white rounded-3xl border border-sky-200 shadow-md overflow-hidden";
      cardEl.innerHTML = `
        <div class="bg-gradient-to-r from-[#0284C7] to-sky-500 px-5 py-3.5 text-white flex items-center justify-between">
          <div class="flex items-center gap-2 font-extrabold text-sm">
            <i class="ph-fill ph-clipboard-text text-lg"></i>
            <span>접수된 맞춤 매물 희망 조건</span>
          </div>
          <button type="button" onclick="restartChat()" class="text-[11px] bg-white/20 hover:bg-white/30 px-2.5 py-1 rounded-full font-bold transition">
            처음부터 다시
          </button>
        </div>

        <div class="p-4 sm:p-5 space-y-3">
          <pre id="summaryPre" class="text-xs text-slate-700 bg-sky-50/80 p-3.5 rounded-2xl border border-sky-100 whitespace-pre-wrap font-sans leading-relaxed select-all">${escapeHtml(summaryText)}</pre>

          <div class="space-y-2.5 pt-1">
            <!-- 1. 오픈카카오톡으로 전송 (자동 복사 + 링크 이동 + 후속 팝업) -->
            <button type="button" onclick="sendViaChannel('kakao')"
              class="w-full py-3.5 rounded-2xl bg-[#FEE500] hover:brightness-95 active:scale-[0.99] text-[#191919] font-extrabold text-sm shadow-sm flex items-center justify-center gap-2 transition">
              <i class="ph-fill ph-chat-teardrop-text text-lg"></i>
              <span>💬 오픈카카오톡으로 문의 보내기 (자동복사)</span>
            </button>

            <!-- 2. 인스타그램 DM으로 전송 (자동 복사 + 링크 이동 + 후속 팝업) -->
            <button type="button" onclick="sendViaChannel('insta')"
              class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-purple-600 via-pink-500 to-amber-500 hover:brightness-95 active:scale-[0.99] text-white font-extrabold text-sm shadow-sm flex items-center justify-center gap-2 transition">
              <i class="ph-fill ph-instagram-logo text-lg"></i>
              <span>📩 인스타그램 DM으로 문의 보내기 (자동복사)</span>
            </button>

            <!-- 3. 보조 버튼: 내용만 복사 / 문자 전송 -->
            <div class="grid grid-cols-2 gap-2 pt-0.5">
              <button type="button" onclick="copyOnlyAndAskNext()"
                class="py-3 rounded-2xl bg-sky-50 hover:bg-sky-100 text-[#0284C7] border border-sky-200 font-bold text-xs flex items-center justify-center gap-1.5 transition">
                <i class="ph-bold ph-copy text-sm"></i>
                <span>내용만 복사하기</span>
              </button>

              <a href="${smsHref}" onclick="setTimeout(() => showAfterSendModal('문자 앱으로 연결되었습니다!', '문자 앱에서 내용을 확인하고 전송해 주세요.'), 500)"
                class="py-3 rounded-2xl bg-sky-50 hover:bg-sky-100 text-[#0284C7] border border-sky-200 font-bold text-xs flex items-center justify-center gap-1.5 transition">
                <i class="ph-bold ph-chat-circle-dots text-sm"></i>
                <span>문자(SMS) 전송</span>
              </a>
            </div>
          </div>

          <!-- 하단 바로가기 액션 (매물 보러가기 / 창 닫기) -->
          <div class="pt-3 mt-2 border-t border-slate-100 flex items-center justify-between gap-2">
            <button type="button" onclick="goToListingSite()"
              class="flex-1 py-2.5 rounded-xl bg-[#0284C7] hover:bg-sky-700 text-white text-xs font-extrabold flex items-center justify-center gap-1 transition">
              <i class="ph-fill ph-house-line"></i>
              <span>매물 보는 사이트 이동</span>
            </button>
            <button type="button" onclick="closeCurrentWindow()"
              class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold transition">
              창 닫기
            </button>
          </div>
        </div>
      `;

      container.appendChild(cardEl);
      scrollToBottom();
    }

    // ================= 클립보드 복사 & 채널 연결 로직 =================
    function copyTextToClipboard(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (err) {}
      document.body.removeChild(ta);
      if (!ok && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
        return true;
      }
      return ok;
    }

    function sendViaChannel(channel) {
      const ok = copyTextToClipboard(buildFormattedSummaryText());
      const url = ((channel === "kakao" ? CONFIG.KAKAO_OPENCHAT_URL : CONFIG.INSTAGRAM_DM_URL) || "").trim();
      const channelName = channel === "kakao" ? "오픈카카오톡" : "인스타그램 DM";
      const linkReady = url && !url.includes("sample");

      showAfterSendModal(
        ok ? "문의 내용이 복사되었습니다!" : "자동 복사가 되지 않았어요",
        ok ? null : "위 요약 박스를 길게 눌러 직접 복사한 뒤, 채팅창에 붙여넣어 전송해 주세요."
      );
      showToast(
        !linkReady ? "복사만 되었습니다. (채팅 링크가 아직 설정되지 않았어요)"
        : ok ? `문의 내용이 복사되었습니다! ${channelName}에 붙여넣기 해주세요.`
        : "자동 복사에 실패했어요. 요약 박스를 길게 눌러 복사해 주세요."
      );

      // 팝업 차단을 피하려면 클릭 직후(지연 없이) 바로 열어야 합니다
      if (linkReady) {
        const w = window.open(url, "_blank");
        if (w) { try { w.opener = null; } catch (e) {} }
        else { window.location.href = url; }   // 새 창이 막히면 현재 창에서 이동
      }
    }

    function copyOnlyAndAskNext() {
      const text = buildFormattedSummaryText();
      const ok = copyTextToClipboard(text);
      if (ok) {
        showToast("문의 내용이 복사되었습니다!");
        showAfterSendModal("문의 내용이 복사되었습니다!");
      } else {
        showToast("위 요약 박스를 길게 눌러 복사해 주세요.");
      }
    }

    // ================= 후속 행동 모달 (매물 사이트 이동 / 창 닫기) =================
    const DEFAULT_MODAL_DESC = '열린 채팅창에 <b>붙여넣기(길게 누르기 → 붙여넣기)</b> 후 전송해 주세요.<br/>전송을 마치셨다면 아래에서 다음 단계를 선택해 주세요!';
    function showAfterSendModal(titleText, descText) {
      const modal = document.getElementById("afterSendModal");
      document.getElementById("modalTitle").textContent = titleText || "문의 내용이 복사되었습니다!";
      document.getElementById("modalDesc").innerHTML = descText ? escapeHtml(descText) : DEFAULT_MODAL_DESC;
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function hideAfterSendModal() {
      const modal = document.getElementById("afterSendModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    function goToListingSite() {
      const url = (CONFIG.LISTING_SITE_URL || "").trim();
      if (url && !url.includes("example.com")) {
        window.location.href = url;
      } else {
        showToast("매물 보는 사이트로 이동합니다! (실제 배포 시 CONFIG에 주소 입력)");
      }
    }

    function closeCurrentWindow() {
      try { window.close(); } catch (e) {}
      // 창이 닫히면 이 안내는 보이지 않고, 안 닫히는 환경(인앱 브라우저 등)에서만 보입니다
      setTimeout(() => showToast("브라우저 상단 닫기(X) 버튼을 눌러 창을 닫아주세요."), 400);
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toastText").textContent = msg;
      toast.classList.remove("hidden");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.add("hidden");
      }, 3500);
    }
  </script>
</body>
</html>
